<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1120" viewBox="0 0 1440 1120" role="img" aria-labelledby="title desc">
<title id="title">ESPCamGimbal logical wiring diagram</title>
<desc id="desc">ESP32-S3 GPIO 1 drives STEP, GPIO 2 drives DIR, GPIO 42 drives active-low ENABLE, and GPIO 41 drives the MG996R servo signal. Motor power is 12 volts. Separate regulated supplies feed the board at 5 volts and the servo at 5 to 6 volts. All grounds are connected.</desc>
<defs>
<marker id="blueArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#2563eb"/></marker>
<marker id="redArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#dc2626"/></marker>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#172033} .title{font-size:34px;font-weight:700}.sub{font-size:20px;fill:#526179}.head{font-size:24px;font-weight:700}.body{font-size:21px}.small{font-size:18px;fill:#526179}.pin{font-size:22px;font-weight:700}.blue{stroke:#2563eb;stroke-width:4;fill:none;marker-end:url(#blueArrow)}.red{stroke:#dc2626;stroke-width:4;fill:none;marker-end:url(#redArrow)}.box{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}
</style>
</defs>
<rect width="1440" height="1120" fill="#fff"/>
<text x="64" y="62" class="title">ESPCamGimbal · wiring overview</text>
<text x="64" y="98" class="sub">Logical connections from the firmware · GPIO numbers, not physical header positions</text>
<text x="64" y="149" class="head">01   Control signals</text>
<rect x="64" y="174" width="320" height="315" rx="14" class="box"/>
<text x="90" y="217" class="head">ESP32-S3-CAM</text>
<text x="90" y="250" class="small">Board layout in board_pins.h</text>
<text x="90" y="298" class="pin">GPIO 1</text><text x="90" y="351" class="pin">GPIO 2</text>
<text x="90" y="404" class="pin">GPIO 42</text><text x="90" y="457" class="pin">GPIO 41</text>
<rect x="778" y="174" width="598" height="256" rx="14" class="box"/>
<text x="804" y="217" class="head">A4988 driver → NEMA 17 pan</text>
<text x="804" y="250" class="small">Assumed driver · confirm marking and pinout on your module</text>
<text x="804" y="298" class="pin">STEP</text><text x="804" y="351" class="pin">DIR</text>
<text x="804" y="404" class="pin">ENABLE / EN (active low)</text>
<rect x="778" y="441" width="598" height="65" rx="14" class="box"/>
<text x="804" y="482" class="pin">MG996R tilt servo · signal lead</text>
<path d="M384 290 H765" class="blue"/><text x="420" y="279" class="small">10 kΩ pull-down from STEP to GND</text>
<path d="M384 343 H765" class="blue"/>
<path d="M384 396 H765" class="blue"/><text x="414" y="385" class="small">10 kΩ pull-up to 3.3 V / VDD</text>
<path d="M384 449 H668 V474 H765" class="blue"/>
<text x="64" y="542" class="small">Servo signal: 10 kΩ pull-down to GND. Driver outputs: one motor coil per A / B output pair.</text>
<text x="64" y="574" class="small">A4988: VDD = 3.3 V; RESET + SLEEP held high. For 1/8 steps: MS1 high, MS2 high, MS3 low.</text>
<text x="64" y="630" class="head">02   Power distribution</text>
<rect x="64" y="655" width="266" height="275" rx="14" class="box"/>
<text x="90" y="705" class="head">12 V supply</text>
<text x="90" y="742" class="body">Separate regulated</text><text x="90" y="772" class="body">branches for board</text><text x="90" y="802" class="body">and servo power</text>
<text x="90" y="893" class="small">GND shared by all devices</text>
<rect x="460" y="655" width="390" height="78" rx="12" class="box"/>
<text x="486" y="702" class="pin">12 V directly to motor driver</text>
<rect x="460" y="753" width="390" height="78" rx="12" class="box"/>
<text x="486" y="800" class="pin">Buck converter · 5 V output</text>
<rect x="460" y="851" width="390" height="78" rx="12" class="box"/>
<text x="486" y="898" class="pin">Separate buck · 5–6 V output</text>
<rect x="987" y="655" width="389" height="78" rx="12" class="box"/>
<text x="1011" y="687" class="pin">Driver VMOT / motor supply</text><text x="1011" y="716" class="small">100 µF across VMOT and GND</text>
<rect x="987" y="753" width="389" height="78" rx="12" class="box"/>
<text x="1011" y="800" class="pin">ESP32-S3 board · 5V input</text>
<rect x="987" y="851" width="389" height="78" rx="12" class="box"/>
<text x="1011" y="883" class="pin">MG996R · servo power lead</text><text x="1011" y="912" class="small">470–1000 µF near servo connector</text>
<path d="M330 694 H447" class="red"/><path d="M330 792 H447" class="red"/><path d="M330 890 H447" class="red"/>
<path d="M850 694 H974" class="red"/><path d="M850 792 H974" class="red"/><path d="M850 890 H974" class="red"/>
<rect x="64" y="951" width="1312" height="48" rx="10" fill="#e2e8f0"/>
<text x="90" y="982" class="body">Common GND: supply return + both buck returns + ESP32-S3 GND + driver GND + servo GND</text>
<text x="64" y="1040" class="body">Never connect 12 V to the ESP32-S3 board or the servo. Use the regulated branches shown above.</text>
<text x="64" y="1077" class="small">GPIO map verified from firmware. A4988 carrier assumed; confirm its marking and labeled terminals before wiring.</text>
</svg>
